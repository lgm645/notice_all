services:
  db:
    image: postgres:16-alpine
    container_name: knu-notices-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: knu
      POSTGRES_PASSWORD: knu
      POSTGRES_DB: knu_notices
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - knu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knu -d knu_notices"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  knu_pgdata:
