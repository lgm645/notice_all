name: 공지 자동 수집

# 매시 정각 부하를 피해 17분에 실행. 지연은 watchdog에서 별도 감시.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: '과거 보충 시작일 YYYY-MM-DD (비우면 성공 체크포인트 기준)'
        required: false
        type: string

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  scrape:
    name: 11개 게시판 수집
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 예약 수집 비활동 자동중지 방지
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/scrape.yml/enable"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/watchdog.yml/enable"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # 실제 Postgres(Supabase) 에 수집. 저장소 Secret 에 DATABASE_URL 등록 필요.
      - name: db:init (idempotent)
        env:
          DB_DRIVER: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:init

      - name: scrape all sources
        env:
          DB_DRIVER: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPER_CONTACT: ${{ secrets.SCRAPER_CONTACT }}
          SCRAPER_REMOTE_ORIGIN: https://notice-all-h7ls.vercel.app
          BACKFILL_SINCE: ${{ inputs.since }}
        run: |
          args=()
          if [ -n "$BACKFILL_SINCE" ]; then args+=(--since "$BACKFILL_SINCE"); fi
          npm run scrape -- "${args[@]}"
