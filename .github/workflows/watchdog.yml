name: 공지 수집 지연 감시

on:
  schedule:
    - cron: '31 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: notice-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - name: 두 예약 워크플로 활성 유지
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/scrape.yml/enable"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/watchdog.yml/enable"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 출처별 성공 체크포인트 감시 및 복구 확인
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_URL: https://notice-all-h7ls.vercel.app/api/health
        run: node .github/scripts/watch-collection.mjs
